services:
  - type: web
    name: forecombine-ml-engine
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --no-cache-dir -r requirements-prod.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHONPATH
        value: backend:.
      - key: JWT_SECRET
        value: prod-secret-render-key-4921
      - key: DATABASE_URL
        value: sqlite:///./forecombine.db
      - key: PYTHON_VERSION
        value: 3.11.8
